{% extends "base.html" %}
{% block content %}
<div class="text-center mb-4"><h1 class="fw-bold">Detect Phishing with AI</h1>
<p class="text-muted">Paste an email or a URL and get an instant machine-learning verdict.</p></div>
<div class="row justify-content-center"><div class="col-lg-8">
<ul class="nav nav-pills mb-3 justify-content-center">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-email">&#9993; Email</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-url">&#128279; URL</button></li>
</ul>
<div class="tab-content card shadow-sm p-4">
  <div class="tab-pane fade show active" id="tab-email">
    <textarea id="email-input" class="form-control mb-3" rows="8" placeholder="Paste the full email text here..."></textarea>
    <button class="btn btn-primary w-100" onclick="analyze('email')">Analyze Email</button>
  </div>
  <div class="tab-pane fade" id="tab-url">
    <input id="url-input" class="form-control mb-3" placeholder="e.g. http://paypal-secure-login.xyz/verify">
    <button class="btn btn-primary w-100" onclick="analyze('url')">Analyze URL</button>
  </div>
</div>
<div id="result" class="mt-4"></div>
</div></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/app.js') }}"></script>{% endblock %}
