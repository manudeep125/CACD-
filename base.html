<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishGuard AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark pg-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">&#128737; PhishGuard AI</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='home' }}" href="/">Analyze</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='dashboard' }}" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if page=='history' }}" href="/history">History</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<footer class="text-center text-muted small pb-4">PhishGuard AI &middot; Final Year CSE Project</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
